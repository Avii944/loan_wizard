<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Loan Wizard — Poonawalla Fincorp{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <div class="brand">Loan <span class="badge">Wizard</span></div>
    <div class="links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('audit_dashboard') }}">Audit Trail</a>
      <a href="{{ url_for('api_health') }}" target="_blank">Health</a>
    </div>
  </nav>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
